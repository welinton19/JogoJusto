name: Continuous Integration Jogo Justo

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./JogoJusto/JogoJusto.csproj

      - name: Build
        run: dotnet build ./JogoJusto/JogoJusto.csproj --no-restore

      - name: Test
        run: dotnet test ./JogoJusto.Tests