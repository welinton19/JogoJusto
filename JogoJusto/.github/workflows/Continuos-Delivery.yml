name: CI/CD - JogoJusto

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build + Testes
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore ./JogoJusto/JogoJusto.csproj

      - name: Build da aplicação
        run: dotnet build ./JogoJusto/JogoJusto.csproj --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test ./JogoJustoTestes/JogoJustoTestes.csproj --configuration Release --verbosity normal

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Staging
  # ─────────────────────────────────────────────
  docker-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push - Staging
        uses: docker/build-push-action@v5
        with:
          context: ./JogoJusto
          file: ./JogoJusto/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jogojusto:staging

  # ─────────────────────────────────────────────
  # JOB 3: Deploy Produção
  # ─────────────────────────────────────────────
  docker-production:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: docker-staging
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push - Produção
        uses: docker/build-push-action@v5
        with:
          context: ./JogoJusto
          file: ./JogoJusto/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jogojusto:latest
            ghcr.io/${{ github.repository_owner }}/jogojusto:${{ github.sha }}

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'jogojusto-api'
          images: 'ghcr.io/${{ github.repository_owner }}/jogojusto:latest'
          publish-profile: ${{ secrets.AZURE_PROFILE }}
